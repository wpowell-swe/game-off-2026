[project]
name = "shiftjam-pipeline"
version = "0.1.0"
description = "Multi-agent content pipeline for ShiftJam (writer + reviewer crews -> game-ready JSON)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
shiftjam-pipeline = "shiftjam_pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shiftjam_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
